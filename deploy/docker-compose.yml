  milvus:
    image: milvusdb/milvus:v3.0.0
    container_name: hm-milvus
    security_opt:
      - seccomp:unconfined
    environment:
      # 嵌入式 etcd，替代原来的独立 etcd 容器
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      # 本地存储，替代原来的 MinIO
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    command: milvus run standalone
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
      - ./milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./milvus/user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 10
    restart: unless-stopped
    networks:
      - insurance-net
  attu:
    image: zilliz/attu:v3.0.0-beta.6
    ports:
      - "3000:3000"
    environment:
      - MILVUS_ADDRESS=milvus:19530
    volumes:
      - attu-data:/data
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - insurance-net

volumes:
  postgres_data:
  # etcd_data:
  # minio_data:
  milvus_data:
  attu-data:

networks:
  insurance-net:
    driver: bridge
